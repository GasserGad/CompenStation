# Render Blueprint: one free web service. The database lives on Neon (free tier).
services:
  - type: web
    name: compenstation
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard
      - key: PUBLIC_ORIGIN
        sync: false # e.g. https://compenstation.onrender.com
      - key: REDIRECT_HOSTS
        sync: false # optional: old hosts that redirect to PUBLIC_ORIGIN, e.g. compenstation.onrender.com
